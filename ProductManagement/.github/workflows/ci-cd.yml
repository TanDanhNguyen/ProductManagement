
name: ProductManagement CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ProductManagement.sln

      - name: Build solution
        run: dotnet build ProductManagement.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ProductManagement.sln --no-build --configuration Release --verbosity normal
